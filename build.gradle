// DEV56J19 village-level structure-start filter (Forge 1.20.1)
buildscript {
    repositories { maven { url 'https://repo.spongepowered.org/repository/maven-public/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'traincraft.j19.refmap.json'
    config 'traincraft.j19.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "Traincraft-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                traincraft {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        gameTestServer {}

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
// TC_DEV38_R1E6_JEI_OPTIONAL_INTEGRATION
repositories {
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
}
dependencies {
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.56.0.205")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.56.0.205")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.56.0.205")
}
// TC_DEV38_R1E6_JEI_OPTIONAL_INTEGRATION_END
// TC_DEV38_R1F1B_AE2_RAIL_POWER
repositories {
    mavenCentral()
    maven { url = "https://www.cursemaven.com" }
}
dependencies {
    // Compile against the official Forge 1.20.1 AE2 15.4.11 CurseForge file.
    // This stays compile-only and is NOT bundled into the TafariCraft jar.
    compileOnly fg.deobf("curse.maven:applied-energistics-2-223794:8991271")

    // Development runtime only so runClient can validate the native ME-power bridge.
    runtimeOnly fg.deobf("curse.maven:guideme-1173950:8204776")
    runtimeOnly fg.deobf("curse.maven:applied-energistics-2-223794:8991271")
}
// TC_DEV38_R1F1B_AE2_RAIL_POWER_END
// TC_DEV38_R1F1C_AE2_DEV_REFMAP_REMAP
// Required only by the ForgeGradle deobfuscated development runtime when a
// released mod dependency (AE2) ships production mixin refmaps.
// Production Minecraft/modpack environments do not need this workaround.
minecraft {
    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}
// TC_DEV38_R1F1C_AE2_DEV_REFMAP_REMAP_END
// TC_DEV38_R1F2A_MEKANISM_RUNTIME
dependencies {
    // Development-only interoperability validation.
    // Mekanism 10.4.16.80 - Minecraft 1.20.1 Forge
    runtimeOnly fg.deobf("curse.maven:mekanism-268560:6552911")

    // Applied Mekanistics 1.4.3 - Minecraft 1.20.1 Forge
    runtimeOnly fg.deobf("curse.maven:applied-mekanistics-574300:7244744")
}
// TC_DEV38_R1F2A_MEKANISM_RUNTIME_END
// TC_DEV38_R1G1S2_SERVER_REFMAP
// ForgeGradle development-server only.
// AE2 15.4.11 ships production/SRG mixin refmaps.  runClient already remaps
// those refmaps; runServer must do the same or AE2 asks for m_129815_ in the
// deobfuscated MinecraftServer class and aborts before Traincraft starts.
minecraft {
    runs {
        server {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}
// TC_DEV38_R1G1S2_SERVER_REFMAP_END

// DEV56J2 - use native Forge/Minecraft jigsaw-pool injection in the disposable test world.
// Avoid Structure Pool API's SRG-name mixin failure in ForgeGradle userdev.
// Production dependency and deployment will be decided after live placement acceptance.
